
name: PontoGuard Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Syntax-check Google Apps Script sources
        run: |
          for file in apps-script/*.gs; do
            temp_file="$(mktemp --suffix=.js)"
            cp "$file" "$temp_file"
            node --check "$temp_file"
            rm -f "$temp_file"
          done

      - name: Run automated tests
        run: npm test
